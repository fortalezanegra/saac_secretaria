<div  fxLayout="row" fxLayoutAlign="center">

    <div fxLayout="column" fxFlex="1000px">

        <!--Formulario Membros-->
        <form frmCadastroMembro="ngForm" class="mt-60">

            <!--Card Formulario Membros-->
            <mat-card>

                <!--Cabeçalho-->
                <mat-card-header>
                    <mat-card-title>Cadastro de Membros</mat-card-title>
                </mat-card-header>

                <!--Corpo-->
                <mat-card-content class="mt-20">

                    <!--Campo Tipo Vínculo-->
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column">
                            <mat-form-field class="full-width">
                                <mat-label>Tipo Vínculo: *</mat-label>
                                <input matInput type="text" placeholder="Selecione o vínculo"/>
                            </mat-form-field>
                        </div>
                    </div>

                    <!--Campo Nome-->
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column">
                            <mat-form-field class="full-width">
                                <mat-label>Nome: *</mat-label>
                                <input matInput type="text" placeholder="Digite o nome"/>
                            </mat-form-field>
                        </div>
                    </div>

                    <!--Campo Sexo-->
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column">
                            <mat-form-field class="full-width">
                                <mat-label>Sexo: *</mat-label>
                                <input matInput type="text" placeholder="Selecione o Sexo"/>
                            </mat-form-field>
                        </div>
                    </div>

                    <!--Campo Data Nascimento-->
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column">
                            <mat-form-field class="full-width">
                                <mat-label>Data Nacimento:</mat-label>
                                <input matInput type="text" placeholder="Informe a da data de nascimento"/>
                            </mat-form-field>
                        </div>
                    </div>

                    <!--Campo Telefone-->
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column">
                            <mat-form-field class="full-width">
                                <mat-label>Telefone:</mat-label>
                                <input matInput type="text" placeholder="Informe o telefone"/>
                            </mat-form-field>
                        </div>
                    </div>

                    <!--Campo Email-->
                    <div fxLayout="row" fxLayoutAlign="start" fxLayoutGap="16px">
                        <div fxLayout="column">
                            <mat-form-field class="full-width">
                                <mat-label>Email:</mat-label>
                                <input matInput type="email" placeholder="Informe o Email"/>
                            </mat-form-field>
                        </div>
                    </div>

                </mat-card-content>

                <!--Rodapé-->
                <mat-card-footer>

                </mat-card-footer>

            </mat-card>

        </form>

    </div>

</div>
