spring.application.name=Saac-Secretaria
server.port=8081

spring.datasource.url=jdbc:mysql://${DB_SERVER}/${DB_NAME}?sslMode=DISABLED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.public-key-path=classpath:keys/public_key.pem

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.org.springframework=DEBUG
logging.level.br.com.adbrascosmopolis.saac_secretaria=DEBUG

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=TRACE

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
